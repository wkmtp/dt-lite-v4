apiVersion: dt-lite.io/v1
kind: IntegrationProfile
metadata:
  name: profile-park-2
  namespace: smart-park
  labels:
    app: dt-lite-smart-park
spec:
  code: profile.park.2
  displayName: "集成配置模板 2"
  protocol: bacnet
  address: "bacnet://192.168.2.1:4840"
  polling_interval: 5s
  timeout: 30s
  retry_policy:
    max_attempts: 3
    backoff: exponential
  mappings:
    - source: point.temperature
      target: property.temp
      transform: raw_to_celsius
    - source: point.humidity
      target: property.humidity
      transform: raw_to_percent
  metadata:
    version: v1.0.0
    created: 2026-09-22
