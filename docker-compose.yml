version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: dtlite-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtlite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtlite_pass}
      POSTGRES_DB: ${POSTGRES_DB:-dtlite}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtlite_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dtlite-network

  redis:
    image: redis:7-alpine
    container_name: dtlite-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dtlite-network

  emqx:
    image: emqx/emqx:5.7.0
    container_name: dtlite-emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dtlite-network

  minio:
    image: minio/minio:latest
    container_name: dtlite-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dtlite-network

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: dtlite-gateway
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtlite_user}:${POSTGRES_PASSWORD:-dtlite_pass}@postgres:5432/${POSTGRES_DB:-dtlite}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dtlite-network
    restart: unless-stopped

  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    container_name: dtlite-identity
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtlite_user}:${POSTGRES_PASSWORD:-dtlite_pass}@postgres:5432/${POSTGRES_DB:-dtlite}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dtlite-network
    restart: unless-stopped

  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: dtlite-core
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtlite_user}:${POSTGRES_PASSWORD:-dtlite_pass}@postgres:5432/${POSTGRES_DB:-dtlite}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dtlite-network
    restart: unless-stopped

  twin:
    build:
      context: ./services/twin
      dockerfile: Dockerfile
    container_name: dtlite-twin
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtlite_user}:${POSTGRES_PASSWORD:-dtlite_pass}@postgres:5432/${POSTGRES_DB:-dtlite}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dtlite-network
    restart: unless-stopped

  iot:
    build:
      context: ./services/iot
      dockerfile: Dockerfile
    container_name: dtlite-iot
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtlite_user}:${POSTGRES_PASSWORD:-dtlite_pass}@postgres:5432/${POSTGRES_DB:-dtlite}
      MQTT_BROKER: tcp://emqx:1883
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - dtlite-network
    restart: unless-stopped

  telemetry:
    build:
      context: ./services/telemetry
      dockerfile: Dockerfile
    container_name: dtlite-telemetry
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtlite_user}:${POSTGRES_PASSWORD:-dtlite_pass}@postgres:5432/${POSTGRES_DB:-dtlite}
      TIMESCALEDB_URL: postgresql+asyncpg://${POSTGRES_USER:-dtlite_user}:${POSTGRES_PASSWORD:-dtlite_pass}@postgres:5432/${POSTGRES_DB:-dtlite}_timescaledb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dtlite-network
    restart: unless-stopped

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: dtlite-ai
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtlite_user}:${POSTGRES_PASSWORD:-dtlite_pass}@postgres:5432/${POSTGRES_DB:-dtlite}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dtlite-network
    restart: unless-stopped

  application:
    build:
      context: ./services/application
      dockerfile: Dockerfile
    container_name: dtlite-application
    ports:
      - "8007:8007"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtlite_user}:${POSTGRES_PASSWORD:-dtlite_pass}@postgres:5432/${POSTGRES_DB:-dtlite}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dtlite-network
    restart: unless-stopped

  frontend-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: dtlite-frontend-web
    ports:
      - "3000:80"
    networks:
      - dtlite-network
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: dtlite-frontend-admin
    ports:
      - "3001:80"
    networks:
      - dtlite-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  minio_data:

networks:
  dtlite-network:
    driver: bridge
