apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: dtlite
  labels:
    app: ai
    tier: intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
        tier: intelligence
    spec:
      containers:
        - name: ai
          image: ${REGISTRY:-registry.local}/dtlite-ai:${IMAGE_TAG:-latest}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ai-config
          env:
            - name: AI_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: openai-api-key
            - name: AI_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: anthropic-api-key
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      restartPolicy: Always
