apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
  namespace: dtlite
  labels:
    app: telemetry
    tier: data
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry
  template:
    metadata:
      labels:
        app: telemetry
        tier: data
    spec:
      containers:
        - name: telemetry
          image: ${REGISTRY:-registry.local}/dtlite-telemetry:${IMAGE_TAG:-latest}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: telemetry-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: telemetry-secrets
                  key: jwt-secret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetry-secrets
                  key: db-password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          healthProbe:
            livenessProbe:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 12
            periodSeconds: 10
      restartPolicy: Always
