apiVersion: v1
kind: Service
metadata:
  name: telemetry
  namespace: dtlite
  labels:
    app: telemetry
spec:
  type: ClusterIP
  selector:
    app: telemetry
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
