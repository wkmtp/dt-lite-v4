version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dtlite_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ..
      dockerfile: deployment/docker/ai.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtlite}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dtlite_ai}
      REDIS_URL: redis://redis:6379/0
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY}
      AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-large}
      AI_RAG_TOP_K: ${AI_RAG_TOP_K:-10}
      AI_AGENT_MAX_ITERATIONS: ${AI_AGENT_MAX_ITERATIONS:-10}
    ports:
      - "${AI_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ai_promdata:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ai_grafanadata:/var/lib/grafana
      - ../grafana/ai-dashboard.json:/etc/grafana/provisioning/dashboards/ai.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  ai_pgdata:
  ai_promdata:
  ai_grafanadata:
