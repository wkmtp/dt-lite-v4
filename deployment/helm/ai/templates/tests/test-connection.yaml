apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-connection"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['sh', '-c', 'wget -qO- http://{{ .Release.Name }}-ai:80/ || echo "Service not ready yet, trying health endpoint..." && wget -qO- http://{{ .Release.Name }}-ai:80/ && echo "" && echo "Health check passed"']
      env:
        - name: SERVICE_NAME
          value: "{{ .Release.Name }}-ai"
        - name: SERVICE_PORT
          value: "80"
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-service"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
    "helm.sh/hook-weight": "1"
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ['sh', '-c', 'echo "Testing service connectivity..." && wget -qO- http://{{ .Release.Name }}-ai:80/ && echo "" && echo "Service test passed successfully"']
  restartPolicy: Never
