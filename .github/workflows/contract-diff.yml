name: Contract Diff Gate

on:
  pull_request:
    branches: [main, release/uaa-v1.0-frozen]
    paths:
      - 'packages/schemas/universal/**'
      - 'tools/contract-diff/**'
      - 'packages/industry/smart-park/**'
  push:
    branches: [main, release/uaa-v1.0-frozen]

jobs:
  contract-diff:
    name: Contract Diff Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pytest pytest-asyncio
      - run: pip install -e packages/schemas/
      - run: pip install -e tools/contract-diff/
      - run: pip install -e tools/golden_validator/
      - run: pip install -e tools/scenario_runner/

      - name: Run self-diff tests
        run: python -m pytest tests/contracts/test_compatibility.py::TestCompatibility::test_self_diff_is_zero tests/contracts/test_compatibility.py::TestCompatibility::test_all_schemas_self_diff_zero -v

      - name: Run CLI diff
        run: |
          python tools/contract-diff/cli.py --baseline packages/schemas/universal/ --target packages/schemas/universal/ --output diff-result.json
          cat diff-result.json

      - name: Check result
        run: |
          RESULT=$(cat diff-result.json)
          BREAKING=$(echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('breaking', False))")
          if [ "$BREAKING" = "True" ]; then exit 1; fi
          echo "Contract diff: ZERO"

  helm-test:
    name: Helm Test (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: contract-diff
    if: needs.contract-diff.result == 'success'
    strategy:
      matrix:
        env: [dev, staging, preprod, prod]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Check package
        run: |
          if [ ! -d "packages/industry/smart-park/v1.0/helm" ]; then
            echo "Smart Park v1.0 Helm charts not ready (P0-04 in progress)"
            exit 0
          fi
      - uses: azure/setup-helm@v3
        with:
          version: v3.14.0
      - name: Helm template
        if: hashFiles('packages/industry/smart-park/v1.0/helm/Chart.yaml') != ''
        run: |
          helm template dt-lite-smart-park-${{ matrix.env }} packages/industry/smart-park/v1.0/helm/ -n dt-lite-${{ matrix.env }} -f packages/industry/smart-park/v1.0/helm/values-smart-park.yaml
      - name: Helm lint
        if: hashFiles('packages/industry/smart-park/v1.0/helm/Chart.yaml') != ''
        run: helm lint packages/industry/smart-park/v1.0/helm/ || true

  pytest:
    name: Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pytest-asyncio
      - run: pip install -e packages/schemas/
      - run: pip install -e tools/contract-diff/
      - run: pip install -e tools/golden_validator/
      - run: pip install -e tools/scenario_runner/
      - run: python -m pytest tests/asset/ tests/capability/ tests/external/ tests/contracts/ tests/assembly/ tests/golden/ tests/compatibility/ tests/sync/ tests/edge/ tests/application/test_uaa06_dashboard_workflow.py -k "not current_layout" tests/twin/test_identity_boundary.py tests/ai/test_uaa07_ai_security.py tests/activation/test_activation.py tests/activation/test_architecture.py tests/activation/test_binding.py tests/activation/test_command.py tests/activation/test_models.py tests/activation/test_security.py tests/integration/ -q
