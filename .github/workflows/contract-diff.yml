name: Contract Diff Gate

on:
  pull_request:
    branches: [main, release/uaa-v1.0-frozen]
  push:
    branches: [main, release/uaa-v1.0-frozen]

jobs:
  contract-diff:
    name: Contract Diff Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio

      - name: Run self-diff tests
        run: python -m pytest tests/contracts/test_compatibility.py::TestCompatibility::test_self_diff_is_zero tests/contracts/test_compatibility.py::TestCompatibility::test_all_schemas_self_diff_zero -v

      - name: Run CLI diff
        run: |
          python tools/contract-diff/cli.py --baseline packages/schemas/universal/ --target packages/schemas/universal/ --output diff-result.json
          cat diff-result.json

      - name: Check result
        run: |
          RESULT=$(cat diff-result.json)
          FROZEN=$(echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('is_frozen', False))")
          if [ "$FROZEN" = "False" ]; then exit 1; fi
          echo "Contract diff: FROZEN"

  pytest:
    name: Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio
      - run: python -m pytest tests/asset/ tests/capability/ tests/external/ tests/contracts/ tests/assembly/ tests/golden/ tests/compatibility/ tests/sync/ tests/edge/ tests/application/test_uaa06_dashboard_workflow.py -k "not current_layout" tests/twin/test_identity_boundary.py tests/ai/test_uaa07_ai_security.py tests/activation/test_activation.py tests/activation/test_architecture.py tests/activation/test_binding.py tests/activation/test_command.py tests/activation/test_models.py tests/activation/test_security.py tests/integration/ -q
