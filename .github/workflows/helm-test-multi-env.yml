name: Helm Test - 4 Environments (Multi-Env)

on:
  push:
    branches: [main, release/**]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - staging
          - preprod
          - prod

permissions:
  contents: read

jobs:
  test-dev:
    name: Test Dev Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.inputs.environment == 'all' || github.event.inputs.environment == 'dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.0

      - name: Connect to Dev Cluster
        run: |
          echo "Connecting to Dev cluster..."
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > /tmp/kubeconfig-dev.yaml
          export KUBECONFIG=/tmp/kubeconfig-dev.yaml
          kubectl cluster-info
          echo "Dev cluster connected"
        env:
          KUBECONFIG: /tmp/kubeconfig-dev.yaml

      - name: Check namespace
        run: |
          export KUBECONFIG=/tmp/kubeconfig-dev.yaml
          kubectl get namespace dt-lite-dev

      - name: Check Helm release
        run: |
          export KUBECONFIG=/tmp/kubeconfig-dev.yaml
          helm list -n dt-lite-dev

      - name: Run Helm test
        run: |
          export KUBECONFIG=/tmp/kubeconfig-dev.yaml
          helm test dt-lite-smart-park-dev -n dt-lite-dev --logs --timeout 10m

      - name: Validate API health
        run: |
          export KUBECONFIG=/tmp/kubeconfig-dev.yaml
          kubectl get svc -n dt-lite-dev
          kubectl get pods -n dt-lite-dev -l app=dt-lite-ai

  test-staging:
    name: Test Staging Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.inputs.environment == 'all' || github.event.inputs.environment == 'staging'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.0

      - name: Connect to Staging Cluster
        run: |
          echo "Connecting to Staging cluster..."
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > /tmp/kubeconfig-staging.yaml
          export KUBECONFIG=/tmp/kubeconfig-staging.yaml
          kubectl cluster-info
          echo "Staging cluster connected"
        env:
          KUBECONFIG: /tmp/kubeconfig-staging.yaml

      - name: Check namespace
        run: |
          export KUBECONFIG=/tmp/kubeconfig-staging.yaml
          kubectl get namespace dt-lite-staging

      - name: Check Helm release
        run: |
          export KUBECONFIG=/tmp/kubeconfig-staging.yaml
          helm list -n dt-lite-staging

      - name: Run Helm test
        run: |
          export KUBECONFIG=/tmp/kubeconfig-staging.yaml
          helm test dt-lite-smart-park-staging -n dt-lite-staging --logs --timeout 10m

      - name: Validate API health
        run: |
          export KUBECONFIG=/tmp/kubeconfig-staging.yaml
          kubectl get svc -n dt-lite-staging
          kubectl get pods -n dt-lite-staging -l app=dt-lite-ai

  test-preprod:
    name: Test Pre-Prod Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.inputs.environment == 'all' || github.event.inputs.environment == 'preprod'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.0

      - name: Connect to Pre-Prod Cluster
        run: |
          echo "Connecting to Pre-Prod cluster..."
          echo "${{ secrets.KUBECONFIG_PREPROD }}" | base64 -d > /tmp/kubeconfig-preprod.yaml
          export KUBECONFIG=/tmp/kubeconfig-preprod.yaml
          kubectl cluster-info
          echo "Pre-Prod cluster connected"
        env:
          KUBECONFIG: /tmp/kubeconfig-preprod.yaml

      - name: Check namespace
        run: |
          export KUBECONFIG=/tmp/kubeconfig-preprod.yaml
          kubectl get namespace dt-lite-preprod

      - name: Check Helm release
        run: |
          export KUBECONFIG=/tmp/kubeconfig-preprod.yaml
          helm list -n dt-lite-preprod

      - name: Run Helm test
        run: |
          export KUBECONFIG=/tmp/kubeconfig-preprod.yaml
          helm test dt-lite-smart-park-preprod -n dt-lite-preprod --logs --timeout 10m

      - name: Validate API health
        run: |
          export KUBECONFIG=/tmp/kubeconfig-preprod.yaml
          kubectl get svc -n dt-lite-preprod
          kubectl get pods -n dt-lite-preprod -l app=dt-lite-ai

  test-prod:
    name: Test Prod Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.inputs.environment == 'all' || github.event.inputs.environment == 'prod'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.0

      - name: Connect to Prod Cluster
        run: |
          echo "Connecting to Prod cluster..."
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > /tmp/kubeconfig-prod.yaml
          export KUBECONFIG=/tmp/kubeconfig-prod.yaml
          kubectl cluster-info
          echo "Prod cluster connected"
        env:
          KUBECONFIG: /tmp/kubeconfig-prod.yaml

      - name: Check namespace
        run: |
          export KUBECONFIG=/tmp/kubeconfig-prod.yaml
          kubectl get namespace dt-lite-prod

      - name: Check Helm release
        run: |
          export KUBECONFIG=/tmp/kubeconfig-prod.yaml
          helm list -n dt-lite-prod

      - name: Run Helm test
        run: |
          export KUBECONFIG=/tmp/kubeconfig-prod.yaml
          helm test dt-lite-smart-park-prod -n dt-lite-prod --logs --timeout 10m

      - name: Validate API health
        run: |
          export KUBECONFIG=/tmp/kubeconfig-prod.yaml
          kubectl get svc -n dt-lite-prod
          kubectl get pods -n dt-lite-prod -l app=dt-lite-ai

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-dev, test-staging, test-preprod, test-prod]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Helm Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dev | ${{ needs.test-dev.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging | ${{ needs.test-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-Prod | ${{ needs.test-preprod.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prod | ${{ needs.test-prod.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Missing KUBECONFIG secrets will cause failures. Configure secrets in GitHub repository settings." >> $GITHUB_STEP_SUMMARY
